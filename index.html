<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPals - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body.auth-page {
            background-color: #f8f9fa;
            padding-top: 40px;
            padding-bottom: 40px;
        }
        .auth-card {
            border-radius: 15px;
            padding: 30px;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #6c757d;
        }
        .auth-divider::before, .auth-divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #dee2e6;
        }
        .auth-divider::before {
            margin-right: 10px;
        }
        .auth-divider::after {
            margin-left: 10px;
        }
        .btn-google {
            background-color: #dd4b39;
            color: white;
        }
    </style>
</head>
<body class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card auth-card shadow border-0">
                    <div class="text-center mb-4">
                        <a href="home.html" class="d-inline-block mb-3">
                            <i class="fas fa-paw text-primary fa-3x"></i>
                        </a>
                        <h1 class="card-title">PetPals</h1>
                        <p class="text-muted">Login to your account</p>
                    </div>
                    
                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input name="email" type="email" class="form-control" id="email" placeholder="email@example.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label">Password</label>
                                <a href="forgot-password.html" class="small text-primary">Forgot Password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input name="password" type="password" class="form-control" id="password" placeholder="••••••••" required>
                            </div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Remember me</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">Log In</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="mb-0">Don't have an account? <a href="signup.html" class="text-primary">Sign Up</a></p>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <a href="home.html" class="text-muted"><i class="fas fa-arrow-left me-2"></i>Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="./js/index.js"></script>
<script>
    document.querySelector('form[action="/login"]').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email,
                    password
                }),
                credentials: 'include' // Important for sessions to work
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // Redirect based on the server response
                window.location.href = data.redirect;
            } else {
                alert(data.message || 'Login failed');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred during login');
        }
    });
</script>
</html>
