<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPals - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card auth-card shadow border-0">
                    <div class="text-center mb-4">
                        <a href="home.html" class="d-inline-block mb-3">
                            <i class="fas fa-paw text-primary fa-3x"></i>
                        </a>
                        <h1 class="card-title">PetPals</h1>
                        <p class="text-muted">Reset Your Password</p>
                    </div>
                    
                    <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                        Error message will appear here
                    </div>
                    
                    <div id="successMessage" class="alert alert-success d-none" role="alert">
                        Password reset email sent! Check your inbox for instructions.
                    </div>
                    
                    <form id="resetPasswordForm">
                        <div class="mb-4">
                            <p>Enter the email address associated with your account, and we'll send you a link to reset your password.</p>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="email@example.com" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">Send Reset Link</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="index.html" class="text-primary">Back to Login</a>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <a href="home.html" class="text-muted"><i class="fas fa-arrow-left me-2"></i>Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/home.js"></script>

</html>
