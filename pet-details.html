<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Details - PetPals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand" href="home.html">
                <i class="fas fa-paw text-primary"></i> PetPals
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="petsDropdown" role="button" data-bs-toggle="dropdown">
                            Adopt
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="dogs.html">Dogs</a></li>
                            <li><a class="dropdown-item" href="cats.html">Cats</a></li>
                            <li><a class="dropdown-item" href="other-pets.html">Other Pets</a></li>
                        </ul>
                    </li>
                </ul>
                
                <!-- User menu - shown when logged in -->
                <div class="d-flex align-items-center">
                    <div class="dropdown user-dropdown d-none">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <img id="userAvatar" src="" class="rounded-circle me-2" width="32" height="32" alt="User">
                            <span id="userName"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html">My Profile</a></li>
                            <li><a class="dropdown-item" href="favorites.html">Favorites</a></li>
                            <li><a class="dropdown-item" href="applications.html">My Applications</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item admin-only" href="admin-dashboard.html">Admin Dashboard</a></li>
                            <li><hr class="dropdown-divider admin-only"></li>
                            <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
                        </ul>
                    </div>
                    
                    <!-- Login/Signup buttons - shown when logged out -->
                    <div class="auth-buttons">
                        <a href="index.html" class="btn btn-outline-primary me-2">Login</a>
                        <a href="signup.html" class="btn btn-primary">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Pet Details Section -->
    <section class="py-5">
        <div class="container">
            <div class="row">
                <!-- Back button -->
                <div class="col-12 mb-4">
                    <a href="javascript:history.back()" class="text-decoration-none">
                        <i class="fas fa-arrow-left"></i> Back
                    </a>
                </div>
                
                <!-- Pet details will be loaded dynamically -->
                <div id="petDetailsContainer">
                    <div class="row">
                        <!-- Pet Images -->
                        <div class="col-lg-6 mb-4">
                            <div class="pet-image-main mb-3">
                                <img src="" class="img-fluid rounded" alt="Pet" id="mainPetImage">
                            </div>
                        </div>
                        
                        <!-- Pet Information -->
                        <div class="col-lg-6">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h1 id="petName"></h1>
                                <button class="btn btn-outline-danger favorite-btn" id="favoriteBtn">
                                    <i class="far fa-heart"></i> Add to Favorites
                                </button>
                            </div>
                            
                            <div class="mb-4">
                                <span class="badge bg-primary me-2" id="petType"></span>
                                <span class="badge bg-secondary me-2" id="petBreed"></span>
                            </div>
                            
                            <div class="row mb-4">
                                <div class="col-6 col-md-4 mb-3">
                                    <div class="d-flex flex-column">
                                        <small class="text-muted">Age</small>
                                        <span id="petAge"></span>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4 mb-3">
                                    <div class="d-flex flex-column">
                                        <small class="text-muted">Gender</small>
                                        <span id="petGender"></span>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4 mb-3">
                                    <div class="d-flex flex-column">
                                        <small class="text-muted">Size</small>
                                        <span id="petSize"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <h5>About</h5>
                            <p id="petDescription"></p>
                            
                            <div class="card mb-4">
                                <div class="card-body">
                                    <h5 class="card-title">Shelter Information</h5>
                                    <p class="card-text" id="shelterName"></p>
                                    <p class="card-text" id="shelterAddress"></p>
                                    <p class="card-text" id="shelterContact"></p>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#adoptionModal" id="adoptBtn">
                                    <i class="fas fa-heart"></i> Apply to Adopt
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Adoption Application Modal -->
    <div class="modal fade" id="adoptionModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Adoption Application for <span id="modalPetName"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="adoptionForm">
                        <input type="hidden" id="petId" value="">
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="applicantName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="applicantEmail" required>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="applicantPhone" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Address</label>
                                <input type="text" class="form-control" id="applicantAddress" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Why would you like to adopt this pet?</label>
                            <textarea class="form-control" id="adoptionReason" rows="3" required></textarea>
                        </div>
                        
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Submit Application</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/home.js"></script>
    <script src="/js/pet-details.js"></script>
</body>
</html>
